name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube-bridge-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bridge dependencies
        run: npm install --ignore-scripts
      - name: Test history parser
        run: npm test

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official Android toolchain
        shell: pwsh
        run: .\PrepareBuild.ps1
      - name: Compile and verify APK
        shell: pwsh
        run: .\Build.ps1
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: QuietHome-test-apk
          path: dist/QuietHome.apk
          if-no-files-found: error
